name: Dependabot Auto-Merge

# workflow_run is the fast path. pull_request_target handles normal bot updates, while
# the scheduled sweep recovers events suppressed because GITHUB_TOKEN created the PR.
on:
  workflow_run:
    workflows: ['CI', 'Security']
    types: [completed]
    branches:
      - 'dependabot/**'
      - 'deps/security-autofix'
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, ready_for_review]
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 'Optional trusted automation PR number'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dependabot-automerge
  cancel-in-progress: false

jobs:
  automerge:
    name: Repair, approve, and enable auto-merge
    runs-on: ubuntu-latest
    if: github.repository == 'dorlugasigal/TermBeam'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Drive trusted automation PRs to completion
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ github.event.inputs.pr }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_MERGE_PAT }}
          ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          [ -n "${GH_TOKEN:-}" ] || {
            echo "DEPENDABOT_MERGE_PAT is required for code-owner approval and workflow administration."
            exit 1
          }

          trusted_prs() {
            gh pr list --repo "$REPO" --state open --limit 100 \
              --json number,author,headRefName,headRepository,baseRefName,labels,isDraft \
              --jq '.[] |
                select(.isDraft == false) |
                select(.headRepository.nameWithOwner == "'"$REPO"'") |
                select(.baseRefName == "main") |
                select(
                  (.author.login == "app/dependabot" and
                   (.headRefName | startswith("dependabot/")) and
                   (.labels | map(.name) | index("dependencies"))) or
                  (.author.login == "app/github-actions" and
                   .headRefName == "deps/security-autofix" and
                   (.labels | map(.name) | index("dependencies")) and
                   (.labels | map(.name) | index("security-autofix")))
                ) |
                [.number, .headRefName] | @tsv'
          }

          CANDIDATES=$(trusted_prs)
          if [ -z "$CANDIDATES" ]; then
            echo "No trusted automation PRs are open."
            exit 0
          fi

          REQUESTED_PR="${INPUT_PR:-${EVENT_PR:-}}"
          while IFS=$'\t' read -r PR HEAD_BRANCH; do
            [ -n "$PR" ] || continue

            if [ -n "${REQUESTED_PR:-}" ] && [ "$PR" != "$REQUESTED_PR" ]; then
              continue
            fi
            if [ "$EVENT_NAME" = "workflow_run" ] &&
               [ -n "${WORKFLOW_BRANCH:-}" ] &&
               [ "$HEAD_BRANCH" != "$WORKFLOW_BRANCH" ]; then
              continue
            fi

            echo "Driving PR #${PR} (${HEAD_BRANCH})."

            MERGE_STATE=$(gh pr view "$PR" --repo "$REPO" --json mergeStateStatus --jq '.mergeStateStatus')
            if [ "$MERGE_STATE" = "DIRTY" ]; then
              if [[ "$HEAD_BRANCH" == dependabot/* ]]; then
                gh pr comment "$PR" --repo "$REPO" --body "@dependabot recreate"
                echo "Requested recreation of conflicted Dependabot PR #${PR}."
              else
                gh pr edit "$PR" --repo "$REPO" --add-label needs-human
                echo "PR #${PR} has merge conflicts and requires human intervention."
              fi
              continue
            fi

            if [ "$MERGE_STATE" = "BEHIND" ]; then
              if [[ "$HEAD_BRANCH" == dependabot/github_actions/* ]]; then
                # Workflow branches cannot be updated with a PAT that lacks workflow scope.
                # Recreation also recovers branches previously edited by an automated merge.
                gh pr comment "$PR" --repo "$REPO" --body "@dependabot recreate"
                echo "Requested Dependabot recreation for workflow-file PR #${PR}."
                continue
              else
                gh api -X PUT "repos/${REPO}/pulls/${PR}/update-branch"
                sleep 2
              fi
            fi

            HEAD_SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid')
            for RID in $(gh run list --repo "$REPO" --commit "$HEAD_SHA" --limit 100 \
                --json databaseId,status,conclusion \
                --jq '.[] | select(.status == "action_required" or .conclusion == "action_required") | .databaseId'); do
              gh api -X POST "repos/${REPO}/actions/runs/${RID}/approve"
            done

            REQUIRED_RUNS=$(gh run list --repo "$REPO" --commit "$HEAD_SHA" --limit 100 \
              --json workflowName \
              --jq '[.[] | select(.workflowName == "CI" or .workflowName == "Security")] | length')
            if [ "$REQUIRED_RUNS" -eq 0 ]; then
              # shellcheck disable=SC2016
              gh api graphql \
                -f query='mutation($repository:String!,$branch:String!,$oid:GitObjectID!){createCommitOnBranch(input:{branch:{repositoryNameWithOwner:$repository,branchName:$branch},message:{headline:"ci: trigger checks"},expectedHeadOid:$oid,fileChanges:{}}){commit{oid}}}' \
                -f repository="$REPO" \
                -f branch="$HEAD_BRANCH" \
                -f oid="$HEAD_SHA"
              echo "Created a PAT-authored empty commit to trigger required checks for PR #${PR}."
              continue
            fi

            LABELS=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '[.labels[].name] | join(",")')
            AUTO_MERGE=$(gh pr view "$PR" --repo "$REPO" --json autoMergeRequest \
              --jq '.autoMergeRequest != null')

            if [[ ",$LABELS," == *,needs-human,* ]]; then
              if [ "$AUTO_MERGE" = "true" ]; then
                gh pr merge "$PR" --repo "$REPO" --disable-auto
              fi
              echo "PR #${PR} requires human intervention; skipping approval and merge."
              continue
            fi

            FAILED=$(gh pr checks "$PR" --repo "$REPO" --json state \
              --jq '[.[] | select(.state == "FAILURE" or .state == "ERROR" or .state == "CANCELLED")] | length' \
              || true)
            FAILED=${FAILED:-0}

            if [ "$FAILED" -gt 0 ] && [[ ",$LABELS," == *,ci-transient,* ]]; then
              for RID in $(gh run list --repo "$REPO" --commit "$HEAD_SHA" --limit 100 \
                  --json databaseId,conclusion \
                  --jq '.[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .databaseId'); do
                GH_TOKEN="$ACTIONS_TOKEN" gh run rerun "$RID" --repo "$REPO" --failed
              done
              gh pr edit "$PR" --repo "$REPO" --remove-label ci-transient
            elif [ "$FAILED" -gt 0 ] &&
                 [[ ",$LABELS," != *,needs-human,* ]]; then
              AUTO_FIX_BUSY=$(gh run list --repo "$REPO" --workflow "Dependabot Auto-Fix" --limit 20 \
                --json status \
                --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "pending")] | length')
              if [ "$AUTO_FIX_BUSY" -eq 0 ]; then
                GH_TOKEN="$ACTIONS_TOKEN" gh workflow run "Dependabot Auto-Fix" \
                  --repo "$REPO" -f pr="$PR"
              else
                echo "An auto-fix run is already active; a later sweep will handle PR #${PR}."
              fi
            fi

            REVIEW_STATE=$(gh pr view "$PR" --repo "$REPO" --json latestReviews \
              --jq '[.latestReviews[] | select(.author.login == "dorlugasigal")][0].state // ""')
            if [ "$REVIEW_STATE" != "APPROVED" ]; then
              gh pr review "$PR" --repo "$REPO" --approve
            fi

            if [ "$AUTO_MERGE" != "true" ]; then
              gh pr merge "$PR" --repo "$REPO" --auto --squash
            fi
          done <<< "$CANDIDATES"
