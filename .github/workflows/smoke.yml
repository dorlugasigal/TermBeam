name: Smoke Test

on:
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke Test
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Wait for released version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # A new version can take a few minutes to be served everywhere;
          # --prefer-online skips npm's local metadata cache on each retry.
          for attempt in {1..30}; do
            PUBLISHED=$(npm view "termbeam@${VERSION}" version --prefer-online 2>/dev/null || true)
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "version=${VERSION}" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Waiting for termbeam@${VERSION} (attempt ${attempt}/30)"
            sleep 10
          done
          echo "termbeam@${VERSION} did not reach npm within 5 minutes" >&2
          exit 1

      - name: Verify released package
        run: |
          npm install -g "termbeam@${version}"
          test "$(termbeam --version)" = "termbeam v${version}"
          termbeam --help
